name: Casa Radar 1.3.0 - Android APK
on:
  push:
    branches:
      - main
      - casaradar-v1.3.0
    paths:
      - 'CasaRadar/**'
      - '.github/workflows/casa-radar-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: CasaRadar
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Pruebas basicas
        run: node tests/smoke.cjs
      - name: Compilar APK instalable v1.3.0
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK v1.3.0
        uses: actions/upload-artifact@v4
        with:
          name: CasaRadar-v1.3.0-APK
          path: CasaRadar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30