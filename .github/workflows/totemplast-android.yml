name: TOTEMPLAST Android 1.0 - APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'totemplast-prevision-android/**'
      - '.github/workflows/totemplast-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: totemplast-prevision-android
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar SDK Android preinstalado
        run: echo "ANDROID_HOME=$ANDROID_HOME" && test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Instalar SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK instalable
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK v1.0
        uses: actions/upload-artifact@v4
        with:
          name: TOTEMPLAST-Prevision-v1.0-APK
          path: totemplast-prevision-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
