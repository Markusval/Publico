const ACCESS_KEY='CasaRadar_accessibility_v1';
const ACCESS_DEFAULTS=Object.freeze({fontPercent:100,highContrast:false,largeControls:false});
function clampFontSize(input){const n=Number(input);return Number.isFinite(n)?Math.min(200,Math.max(80,Math.round(n/10)*10)):100}
function readAccessPrefs(){
 try{const saved=JSON.parse(localStorage.getItem(ACCESS_KEY)||'{}');
  return {fontPercent:clampFontSize(saved.fontPercent??100),highContrast:saved.highContrast===true,largeControls:saved.largeControls===true};
 }catch{return {...ACCESS_DEFAULTS}}
}
let accessPrefs=readAccessPrefs();
function setAccessPrefs(update){
 accessPrefs={...accessPrefs,...update,fontPercent:clampFontSize(update.fontPercent??accessPrefs.fontPercent)};
 applyAccessPrefs();
 try{localStorage.setItem(ACCESS_KEY,JSON.stringify(accessPrefs))}catch{ /* Fallback: current session only */ }
 refreshAccessPage();
}
function applyAccessPrefs(){
 document.documentElement.style.setProperty('--font-scale',String(accessPrefs.fontPercent/100));
 document.documentElement.dataset.largeText=String(accessPrefs.fontPercent>100);
 document.body.classList.toggle('high-contrast',accessPrefs.highContrast);
 document.body.classList.toggle('large-controls',accessPrefs.largeControls);
}
function refreshAccessPage(){
 const o=$('#access-font-output');if(o)o.textContent=accessPrefs.fontPercent+' %';

 $$('.access-presets [data-size]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.size)===accessPrefs.fontPercent)));
 for(const [option,value] of [['highContrast',accessPrefs.highContrast],['largeControls',accessPrefs.largeControls]]){
  const b=$('[data-access-toggle="'+option+'"]');if(b){b.setAttribute('aria-pressed',String(value));const txt=b.querySelector('.toggle-value');if(txt)txt.textContent=value?'Activado':'Desactivado'}
 }
}

function safeText(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function val(v){return safeText(v||'')}
function safeUrl(v,schemes=['https:','http:']){try{let u=new URL(String(v||'').trim());return schemes.includes(u.protocol)?u.href:''}catch{return ''}}
function searchMap(r){return safeUrl(r.maps)||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([r.name,r.address].filter(Boolean).join(' '))}
const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0);
const money2=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(Number(n)||0);
const count=n=>new Intl.NumberFormat('es-ES').format(n||0);
const today=()=>isoDateTime().slice(0,10);
function isoDateTime(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function formatDate(s){if(!s)return '\u2014'; const d=String(s).slice(0,10).split('-');return d.length===3?`${d[2]}/${d[1]}/${d[0]}`:safeText(s)}
function formatDatetime(s){return formatDate(s)+(String(s).includes('T')?' \u00b7 '+safeText(String(s).slice(11,16)):'')}
function agoTimestamp(s){return s?new Date(s).getTime():0}
function id(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function byId(kind,x){return state.data[kind].find(r=>r.id===x)}
function factoryName(x){const f=byId('factories',x);return f?f.name:'Sin asignar'}
function modelName(x){const r=byId('models',x);return r?r.name:'No indicado'}
function budgetTotal(r){let s=COST_FIELDS.reduce((a,[k])=>a+(Number(r[k])||0),0);const discount=Number(r.discount)||0;const pre=Math.max(0,s-discount);return pre+(r.vatIncluded?0:(pre*(Number(r.vatRate)||0)/100))}
function budgetPerM2(r){const ar=Number(r.usefulArea||r.builtArea)||Number((byId('models',r.modelId)||{}).usefulArea)||Number((byId('models',r.modelId)||{}).builtArea)||0;return ar?budgetTotal(r)/ar:0}
function compareDate(a,b){return String(a||'').localeCompare(String(b||''))}
function arr(kind){return state.data[kind]||[]}
function attachedTo(kind,x){return arr('attachments').filter(f=>f.relatedType===kind&&f.relatedId===x)}
function attachedCount(kind,x){return attachedTo(kind,x).length}
function bytes(n){return n>1048576?(n/1048576).toFixed(1)+' MB':(n/1024).toFixed(0)+' KB'}
function matching(record,extra=''){const q=state.query.trim().toLocaleLowerCase('es');if(!q)return true;return (Object.entries(record).filter(([k,v])=>typeof v==='string'&&!['blob'].includes(k)).map(([,v])=>v).join(' ')+' '+extra).toLocaleLowerCase('es').includes(q)}
function summaryTag(txt){const s=String(txt||''); let cls='gray';if(['Alta','Favorito','Elegido','Realizada','Aceptado','Visitado'].includes(s))cls='green';if(['Cita concertada','En negociaci\u00f3n','Recibido','Presupuesto recibido','Pendiente','Solicitado'].includes(s))cls='amber';if(['Descartado','Cancelada','No'].includes(s))cls='red';if(['Media','Contactado','Revisado'].includes(s))cls='blue';return `<span class="tag ${cls}">${safeText(s||'Sin datos')}</span>`}
function link(url,txt,iconName='link'){return url?`<a class="inline-link" href="${safeText(url)}" target="_blank" rel="noopener noreferrer">${ico(iconName,14)} ${safeText(txt)}</a>`:''}
function alertToast(msg,error=false){const div=document.createElement('div');div.className='toast'+(error?' error':'');div.textContent=msg;$('#toasts').appendChild(div);setTimeout(()=>div.remove(),4600)}
const store={
 mode:'memory',conn:null,memory:{},
 async init(){
  if('indexedDB' in window){try{
   this.conn=await new Promise((resolve,reject)=>{const req=indexedDB.open('CasaRadar_Local_2026',1);req.onupgradeneeded=()=>{const d=req.result;for(const n of [...STORE_NAMES,'meta'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:n==='meta'?'key':'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(new Error('Base de datos bloqueada'))});

  try{const q='casaradar_test';localStorage.setItem(q,'1');localStorage.removeItem(q);this.mode='localstorage'}catch{this.mode='memory'}
 },
 async all(n){
  if(this.mode==='indexeddb')return new Promise((resolve,reject)=>{const q=this.conn.transaction(n).objectStore(n).getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});
  if(this.mode==='localstorage')return JSON.parse(localStorage.getItem('casaradar_'+n)||'[]');
  return this.memory[n]||[];
 },
 async put(n,row){
  if(this.mode==='indexeddb')return new Promise((resolve,reject)=>{const tx=this.conn.transaction(n,'readwrite');tx.objectStore(n).put(row);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
  const list=await this.all(n);const k=n==='meta'?'key':'id';const i=list.findIndex(x=>x[k]===row[k]);if(i>=0)list[i]=row;else list.push(row);return this.overwrite(n,list)
 },
 async del(n,key){
  if(this.mode==='indexeddb')return new Promise((resolve,reject)=>{const tx=this.conn.transaction(n,'readwrite');tx.objectStore(n).delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
  const rows=await this.all(n);return this.overwrite(n,rows.filter(x=>(n==='meta'?x.key:x.id)!==key))
 },
 async overwrite(n,rows){
  if(this.mode==='indexeddb')return new Promise((resolve,reject)=>{const tx=this.conn.transaction(n,'readwrite');const t=tx.objectStore(n);t.clear();for(const r of rows)t.put(r);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
  if(this.mode==='localstorage')localStorage.setItem('casaradar_'+n,JSON.stringify(rows));else this.memory[n]=rows;
 },
 async replaceAll(data){
  if(this.mode==='indexeddb')return new Promise((resolve,reject)=>{const tx=this.conn.transaction([...STORE_NAMES,'meta'],'readwrite');for(const n of STORE_NAMES){const t=tx.objectStore(n);t.clear();for(const row of data[n]||[])t.put(row)}const m=tx.objectStore('meta');m.clear();m.put({key:'initialized',value:true});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});

 try{
  await store.init();const meta=await store.all('meta');if(!meta.some(m=>m.key==='initialized')){for(const f of SEED_DATA)await store.put('factories',f);await store.put('meta',{key:'initialized',value:true})}

function render(){navButtons();const page=state.page;$('#page-title').textContent=page==='factory'?(byId('factories',state.selectedFactoryId)||{}).name||TITLES.factory:TITLES[page];$('#page-icon').innerHTML=ico(page==='factory'?'factories':page,21);$('#access-shortcut').setAttribute('aria-current',page==='accessibility'?'page':'false');$('#quick-add').innerHTML=ico('plus',17)+'<span class="full-text">'+(page==='factory'?'Registrar actividad':page==='models'?'Nuevo modelo':page==='visits'?'Nueva visita':page==='budgets'?'Nuevo presupuesto':page==='notes'?'Nueva nota':'A\u00f1adir registro')+'</span>';$('#main').innerHTML=(PAGE_RENDER[page]||renderDashboard)();}
function head(kicker,title,desc,right=''){return `<div class="headline"><div><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${desc}</p></div>${right?`<div class="headline-actions">${right}</div>`:''}</div>`}
function bigButton(kind,label,factoryId='',cls='primary'){return `<button class="btn ${cls}" data-action="new" data-kind="${kind}" ${factoryId?`data-factory="${safeText(factoryId)}"`:''}>${ico('plus',15)} ${label}</button>`}
function empt(iconName,title,sub,kind='',fid=''){return `<div class="no-data"><div class="empty-icon">${ico(iconName,24)}</div><h3>${title}</h3><p>${sub}</p>${kind?bigButton(kind,'A\u00f1adir primer registro',fid):''}</div>`}
function renderDashboard(){
 const fullB=arr('budgets').filter(b=>budgetTotal(b)>0), allVisits=arr('visits'),due=agendaItems().filter(x=>x.date<=today()),planned=agendaItems().filter(x=>x.date>today());
 const minimum=fullB.length?Math.min(...fullB.map(b=>budgetTotal(b))):0;
 const metrics=[['Fabricantes',arr('factories').length,'Empresas en tu directorio','factories'],['Modelos de casa',arr('models').length,'Alternativas para comparar','models'],['Visitas y llamadas',allVisits.filter(v=>v.status==='Realizada').length,`${allVisits.length} registros totales`,'visits'],['Presupuestos',fullB.length,minimum?'Desde '+eur(minimum):'A\u00fan sin importes','budgets']];
 const priority=arr('factories').filter(f=>f.status==='Sin contactar'||!f.status).sort((a,b)=>(a.priority==='Alta'?-1:1)-(b.priority==='Alta'?-1:1)).slice(0,5);
 const latest=[...arr('notes').map(x=>({type:'Nota',date:x.createdAt||x.date,title:x.title,sub:factoryName(x.factoryId)})),...arr('visits').map(x=>({type:'Visita',date:x.createdAt||x.date,title:x.type||'Contacto',sub:factoryName(x.factoryId)})),...arr('budgets').map(x=>({type:'Presupuesto',date:x.createdAt||x.date,title:x.title,sub:factoryName(x.factoryId)}))].sort((a,b)=>agoTimestamp(b.date)-agoTimestamp(a.date)).slice(0,5);
 return `<div class="headline"><div><div class="eyebrow">Tu proyecto de vivienda</div><h2>Todo bajo control.</h2><p>Organiza los fabricantes, registra cada visita y compara los costes reales de tu futura casa.</p></div><div class="headline-actions"><button class="btn" data-page="backup">${ico('backup')} Copia de seguridad</button>${bigButton('factories','Nuevo fabricante')}</div></div>
 <div class="kpis">${metrics.map(([label,n,sub,iconName])=>`<div class="kpi"><div class="kpi-top"><div class="label">${label}</div><div class="kpi-icon">${ico(iconName)}</div></div><div class="value">${iconName==='budgets'?count(n):count(n)}</div><div class="desc">${sub}</div></div>`).join('')}</div>
 ${store.mode==='memory'?'<div class="notice alert" style="margin-bottom:18px">Este navegador NO est\u00e1 guardando los cambios. Descarga una copia JSON cuando termines.</div>':''}
 <div class="two-col">
 <section class="panel"><div class="panel-head"><div><h3>Pr\u00f3ximas tareas y seguimientos</h3><p>${due.length} vencidos o para hoy &middot; ${planned.length} futuros</p></div><button class="btn small" data-page="agenda">Ver agenda &rarr;</button></div><div class="panel-body">${agendaList(agendaItems().slice(0,5),true)}</div></section>
 <section class="panel"><div class="panel-head"><div><h3>Fabricantes por contactar</h3><p>Empieza por los de prioridad alta</p></div><button class="btn small" data-page="factories">Ver todos &rarr;</button></div><div class="panel-body">${priority.length?priority.map(f=>`<div class="fact-mini"><div class="split-hdr"><b><button class="link-btn" data-action="open-factory" data-id="${f.id}">${safeText(f.name)}</button></b>${summaryTag(f.priority)}</div><span>${safeText(f.city||f.province)} &middot; ${safeText(f.phone1||'Sin tel\u00e9fono')}</span></div>`).join(''):empt('check','Todos contactados','No quedan fabricantes pendientes de primer contacto.')}</div></section>
 </div>
 <div class="two-col" style="margin-top:18px"><section class="panel"><div class="panel-head"><div><h3>Presupuestos m\u00e1s econ\u00f3micos</h3><p>Comparaci\u00f3n de importes totales registrados</p></div><button class="btn small" data-page="budgets">Comparar &rarr;</button></div><div class="panel-body">${fullB.length?fullB.sort((a,b)=>budgetTotal(a)-budgetTotal(b)).slice(0,5).map((b,i)=>`<div class="agenda-row"><span class="date-square" style="height:42px;width:42px;font-weight:800;font-size:calc(17px * var(--font-scale))">${i+1}</span><div class="agenda-main"><b>${safeText(b.title)}</b><p>${safeText(factoryName(b.factoryId))} ${b.modelId?'\u00b7 '+safeText(modelName(b.modelId)):''}</p></div><div style="text-align:right;white-space:nowrap"><b>${eur(budgetTotal(b))}</b><div class="tiny muted">${budgetPerM2(b)?eur(budgetPerM2(b))+'/m\u00b2':'Sin m\u00b2'}</div></div></div>`).join(''):empt('budgets','Sin presupuestos','Registra importes y partidas para calcular el coste real.', 'budgets')}</div></section>
 <section class="panel"><div class="panel-head"><div><h3>Actividad reciente</h3><p>\u00daltimos registros y anotaciones</p></div></div><div class="panel-body">${latest.length?latest.map(x=>`<div class="agenda-row"><div class="kpi-icon">${ico(x.type==='Nota'?'notes':x.type==='Visita'?'visits':'budgets')}</div><div class="agenda-main"><b>${safeText(x.title||x.type)}</b><p>${safeText(x.sub)} &middot; ${formatDate(x.date)}</p></div><span class="tag gray">${x.type}</span></div>`).join(''):empt('notes','Sin actividad','Anota cualquier contacto o descubrimiento.')}</div></section></div>`
}
function filteredFactories(){return arr('factories').filter(f=>matching(f)&&(!state.filters.province||f.province===state.filters.province)&&(!state.filters.status||f.status===state.filters.status)&&(!state.filters.priority||f.priority===state.filters.priority)).sort((a,b)=>(!!b.favorite-!!a.favorite)||(['Alta','Media','Baja'].indexOf(a.priority)-['Alta','Media','Baja'].indexOf(b.priority))||a.name.localeCompare(b.name,'es'))}
function filtersFactory(){return `<div class="filters"><select id="filter-province" aria-label="Filtrar provincia"><option value="">Todas las provincias</option>${PROVINCES.map(p=>`<option value="${safeText(p)}" ${state.filters.province===p?'selected':''}>${safeText(p)}</option>`).join('')}</select><select id="filter-status" aria-label="Filtrar estado"><option value="">Todos los estados</option>${STATUS.map(p=>`<option value="${safeText(p)}" ${state.filters.status===p?'selected':''}>${safeText(p)}</option>`).join('')}</select><select id="filter-priority" aria-label="Filtrar prioridad"><option value="">Todas las prioridades</option>${PRIORITIES.map(p=>`<option value="${p}" ${state.filters.priority===p?'selected':''}>${p}</option>`).join('')}</select><div class="count-label" id="filtered-count">${filteredFactories().length} empresas</div></div>`}
function renderFactoryCard(f){const m=arr('models').filter(x=>x.factoryId===f.id).length,v=arr('visits').filter(x=>x.factoryId===f.id).length,b=arr('budgets').filter(x=>x.factoryId===f.id).length;return `<article class="factory-card"><div class="card-top"><div><div class="card-title"><button data-action="open-factory" data-id="${f.id}" class="link-btn" style="font-size:inherit;text-align:left;padding:0;color:inherit">${safeText(f.name)}</button></div><div class="card-sub">${safeText([f.city,f.province].filter(Boolean).join(' \u00b7 '))}</div></div><button class="star ${f.favorite?'active':''}" data-action="star" data-id="${f.id}" title="${f.favorite?'Quitar de favoritos':'Marcar favorito'}" aria-label="Favorito">\u2605</button></div><div class="card-tokens">${summaryTag(f.status)}${summaryTag(f.priority)}</div><div class="card-address">${safeText(f.system||'Sistema sin indicar')}<br>${safeText((f.address||'').slice(0,135))}</div><div class="card-metrics"><span><strong>${m}</strong> modelos</span><span><strong>${v}</strong> visitas</span><span><strong>${b}</strong> ofertas</span></div><div class="card-foot"><button class="btn small primary" data-action="open-factory" data-id="${f.id}">Abrir ficha</button>${f.phone1?`<a class="btn small" href="tel:${safeText(String(f.phone1).replace(/[^+\d]/g,''))}">${ico('phone',14)} Llamar</a>`:''}<a class="btn small" href="${safeText(searchMap(f))}" target="_blank" rel="noopener">${ico('pin',14)} Maps</a><button class="circle-btn" title="Editar datos" data-action="edit" data-kind="factories" data-id="${f.id}">${ico('edit',15)}</button></div></article>`}
function renderFactories(){const list=filteredFactories();return `${head('Directorio de proveedores','Fabricantes y exposiciones','Datos iniciales del directorio de 15/10/2026. Confirma contactos y visitas antes de desplazarte.',bigButton('factories','A\u00f1adir fabricante'))}${filtersFactory()}<div id="factory-list" class="factory-grid">${list.map(renderFactoryCard).join('')||empt('factories','No hay empresas con ese filtro','Modifica los filtros o a\u00f1ade otro fabricante.','factories')}</div>`}
function factoryHeader(f){return `<button class="back-btn" data-page="factories">&larr; Volver a todos los fabricantes</button><div class="factory-hero"><div class="hero-top"><div><div class="eyebrow" style="color:#8ee1c6">Ficha completa de proveedor</div><h2>${safeText(f.name)}</h2><div class="sub">${safeText([f.city,f.province,f.system].filter(Boolean).join(' \u00b7 '))}</div><div class="card-tokens" style="margin-top:13px">${summaryTag(f.status)}${summaryTag(f.priority)} ${f.favorite?'<span class="tag">\u2605 Favorito</span>':''}</div></div><button class="btn small" data-action="edit" data-kind="factories" data-id="${f.id}">${ico('edit',15)} Editar empresa</button></div><div class="hero-links">${f.phone1?`<a href="tel:${safeText(f.phone1.replace(/[^+\d]/g,''))}">${ico('phone',14)} ${safeText(f.phone1)}</a>`:''}${f.phone2?`<a href="tel:${safeText(f.phone2.replace(/[^+\d]/g,''))}">${ico('phone',14)} ${safeText(f.phone2)}</a>`:''}${f.email1?`<a href="mailto:${safeText(f.email1)}">Correo</a>`:''}${linkHero(safeUrl(f.website),'Web')}${linkHero(searchMap(f),'Google Maps')}</div></div>`}
function linkHero(url,title){return url?`<a href="${safeText(url)}" target="_blank" rel="noopener">${ico('link',13)} ${title}</a>`:''}
function infoItem(label,value,href){return `<div class="info-item"><div class="label">${label}</div><div class="val">${href&&safeUrl(href)?link(safeUrl(href),value):safeText(value||'Pendiente de anotar')}</div></div>`}
function overview(f){const v=arr('visits').filter(x=>x.factoryId===f.id).sort((a,b)=>compareDate(b.date,a.date)),m=arr('models').filter(x=>x.factoryId===f.id),b=arr('budgets').filter(x=>x.factoryId===f.id),n=arr('notes').filter(x=>x.factoryId===f.id);return `<div class="detail-grid"><div>
 <section class="panel"><div class="panel-head"><h3>Contacto y ubicaciones</h3></div><div class="panel-body"><div class="info-grid">
 ${infoItem('Tel\u00e9fono principal',f.phone1)}${infoItem('Tel\u00e9fono alternativo',f.phone2||f.phone3)}${infoItem('Correo',f.email1)}${infoItem('Persona de contacto',f.contactPerson||'Sin confirmar')}${infoItem('F\u00e1brica / taller',f.factoryAddress)}${infoItem('Exposici\u00f3n',f.showroomAddress)}${infoItem('Tienda / oficina',f.shopAddress)}${infoItem('Direcci\u00f3n de visita',f.address)}${infoItem('Horarios',f.hours)}${infoItem('Zona de montaje',f.coverage)}${infoItem('CTE',f.ctebuilt)}${infoItem('Datos',f.verified)}
 </div>${f.showroom?`<div class="infobox"><b>Exposici\u00f3n:</b> ${safeText(f.showroom)}</div>`:''}${f.notes?`<div class="infobox"><b>Notas iniciales:</b> ${safeText(f.notes)}</div>`:''}<div class="float-actions" style="margin-top:17px"><a href="${safeText(searchMap(f))}" target="_blank" rel="noopener" class="btn small">${ico('pin',14)} C\u00f3mo llegar</a>${f.source?`<a class="btn small" href="${safeText(safeUrl(f.source))}" target="_blank" rel="noopener">Fuente de contacto</a>`:''}</div></div></section>
 <section class="panel" style="margin-top:17px"><div class="panel-head"><div><h3>\u00daltimas visitas y llamadas</h3><p>Historial independiente de cada contacto</p></div>${bigButton('visits','Nueva visita',f.id,'')}</div><div class="panel-body">${v.length?v.slice(0,4).map(x=>`<div class="timeline-item"><div class="timeline-title">${safeText(x.type)} \u00b7 ${formatDatetime(x.date)}</div><div class="timeline-sub">${safeText(x.person||'Sin interlocutor')} ${x.modelId?'\u00b7 '+safeText(modelName(x.modelId)):''}</div><div class="timeline-detail">${safeText((x.summary||x.objective||'').slice(0,260))}</div><button class="link-btn" data-action="edit" data-kind="visits" data-id="${x.id}">Ver / editar</button></div>`).join(''):empt('visits','Sin contactos registrados','Anota cada llamada y visita, tantas veces como necesites.','visits',f.id)}</div></section>
 </div><div>
 <section class="panel"><div class="panel-head"><h3>Actividad del fabricante</h3></div><div class="panel-body"><div class="fact-mini"><b>${count(m.length)} modelos de casa</b><span>Fichas t\u00e9cnicas y alternativas</span></div><div class="fact-mini"><b>${count(v.length)} visitas y llamadas</b><span>Reuniones, impresiones y seguimientos</span></div><div class="fact-mini"><b>${count(b.length)} presupuestos</b><span>Comparaciones de costes totales</span></div><div class="fact-mini"><b>${count(n.length)} observaciones</b><span>Notas organizadas por fecha</span></div><div class="float-actions">${bigButton('models','A\u00f1adir modelo',f.id,'')}${bigButton('budgets','Nuevo presupuesto',f.id,'')}${bigButton('notes','Anotar algo',f.id,'')}</div></div></section>
 <section class="panel" style="margin-top:17px"><div class="panel-head"><h3>Pr\u00f3ximo paso</h3></div><div class="panel-body">${f.nextContactDate?`<div class="tag amber">${formatDate(f.nextContactDate)}</div>`:'<div class="muted">No hay contacto programado.</div>'}<p class="muted tiny" style="line-height:1.7">Puedes fijar una fecha al editar el fabricante o programar un seguimiento desde una visita.</p><button class="btn small" data-action="edit" data-kind="factories" data-id="${f.id}">Programar contacto</button></div></section>
 ${b.filter(x=>budgetTotal(x)>0).length?`<section class="panel" style="margin-top:17px"><div class="panel-head"><h3>Mejor precio anotado</h3></div><div class="panel-body"><div class="kpi"><div class="label">Oferta m\u00e1s econ\u00f3mica</div><div class="value">${eur(Math.min(...b.filter(x=>budgetTotal(x)>0).map(x=>budgetTotal(x))))}</div><div class="desc">Incluye las partidas cargadas y el IVA indicado</div></div></div></section>`:''}
 </div></div>`}
function renderFactoryDetail(){const f=byId('factories',state.selectedFactoryId);if(!f)return `<div class="notice warn">Fabricante no encontrado. <button class="link-btn" data-page="factories">Volver al directorio</button></div>`;const tabs=[['overview','Resumen'],['models','Modelos ('+arr('models').filter(x=>x.factoryId===f.id).length+')'],['visits','Visitas ('+arr('visits').filter(x=>x.factoryId===f.id).length+')'],['budgets','Presupuestos ('+arr('budgets').filter(x=>x.factoryId===f.id).length+')'],['notes','Observaciones ('+arr('notes').filter(x=>x.factoryId===f.id).length+')'],['attachments','Archivos ('+arr('attachments').filter(x=>x.factoryId===f.id).length+')']];return `${factoryHeader(f)}<nav class="tabbar">${tabs.map(([key,label])=>`<button data-action="factory-tab" data-tab="${key}" class="${state.factoryTab===key?'active':''}">${label}</button>`).join('')}</nav>${state.factoryTab==='overview'?overview(f):state.factoryTab==='attachments'?renderAttachments(f.id):state.factoryTab==='models'?renderModels(f.id,true):state.factoryTab==='visits'?renderVisits(f.id,true):state.factoryTab==='budgets'?renderBudgets(f.id,true):renderNotes(f.id,true)}`}
function listActions(kind,x){return `<div class="row-actions"><button class="link-btn" data-action="edit" data-kind="${kind}" data-id="${x.id}">Editar</button>${['models','budgets'].includes(kind)?`<button class="link-btn" data-action="duplicate" data-kind="${kind}" data-id="${x.id}">Duplicar</button>`:''}<button class="link-btn red" data-action="delete" data-kind="${kind}" data-id="${x.id}">Borrar</button></div>`}
function modelCard(x){const f=byId('factories',x.factoryId)||{};const b=arr('budgets').filter(y=>y.modelId===x.id&&budgetTotal(y)>0);return `<article class="model-card"><div class="split-hdr">${summaryTag(x.status||'En estudio')}<span class="muted tiny">${safeText(x.type||'Sin sistema')}</span></div><h4>${safeText(x.name)}</h4><div class="model-descr"><button class="link-btn" data-action="open-factory" data-id="${safeText(x.factoryId)}">${safeText(f.name||'Sin fabricante')}</button><br>${safeText(x.code||'')}</div><div class="model-number">${x.usefulArea||x.builtArea?safeText(x.usefulArea||x.builtArea)+' m\u00b2':'\u2014'}</div><div class="card-metrics"><span>${x.usefulArea?'\u00datiles':'Construidos'}</span><span>${x.bedrooms?safeText(x.bedrooms)+' hab.':''}</span><span>${x.bathrooms?safeText(x.bathrooms)+' ba\u00f1os':''}</span></div><div class="fact-mini" style="margin-top:14px"><b>${b.length?eur(Math.min(...b.map(y=>budgetTotal(y)))):x.advertisedPrice?eur(x.advertisedPrice):'Precio por consultar'}</b><span>${b.length?'Mejor presupuesto desglosado':x.advertisedPrice?'Precio anunciado (sin desglose)':'Sin presupuestos'}</span></div><div class="card-foot"><button class="btn small primary" data-action="edit" data-kind="models" data-id="${x.id}">Ficha t\u00e9cnica</button><button class="btn small" data-action="new" data-kind="budgets" data-factory="${safeText(x.factoryId)}" data-model="${x.id}">Presupuestar</button>${listActions('models',x)}</div></article>`}
function renderModels(factoryId='',embedded=false){const list=arr('models').filter(x=>(!factoryId||x.factoryId===factoryId)&&matching(x,factoryName(x.factoryId))).sort((a,b)=>String(a.name).localeCompare(String(b.name),'es'));return `${embedded?head('Cat\u00e1logo de viviendas','Modelos evaluados','Puedes crear tantos modelos distintos como quieras para esta empresa.',bigButton('models','A\u00f1adir modelo',factoryId)):head('Comparador t\u00e9cnico','Modelos de casas','Superficie, composici\u00f3n de paredes, cubierta, ventanas, instalaciones y costes.',bigButton('models','Nuevo modelo'))}<div class="model-cards">${list.map(modelCard).join('')||empt('models','Todav\u00eda no hay modelos','Crea fichas independientes para cada alternativa, con todos sus materiales y medidas.','models',factoryId)}</div>`}
function renderVisits(factoryId='',embedded=false){const list=arr('visits').filter(x=>(!factoryId||x.factoryId===factoryId)&&matching(x,factoryName(x.factoryId)+' '+modelName(x.modelId))).sort((a,b)=>compareDate(b.date,a.date));return `${head('Historial de reuniones',embedded?'Llamadas y visitas':'Visitas, llamadas y reuniones','Cada visita se guarda por separado; puedes repetir las visitas al mismo fabricante.',bigButton('visits','Registrar contacto',factoryId))}<section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Fecha</th><th>Fabricante / modelo</th><th>Contacto</th><th>Resultado</th><th>Pr\u00f3ximo paso</th><th>Acciones</th></tr></thead><tbody>${list.map(x=>`<tr><td style="white-space:nowrap"><b>${formatDatetime(x.date)}</b><div class="row-sub">${summaryTag(x.status)}</div></td><td><div class="row-title">${safeText(factoryName(x.factoryId))}</div><div class="row-sub">${safeText(modelName(x.modelId))}</div></td><td><b>${safeText(x.type||'Visita')}</b><div class="row-sub">${safeText(x.person||'Persona sin identificar')}</div></td><td><div class="trunc">${safeText(x.summary||x.objective||'Sin observaciones')}</div></td><td>${x.followupDate?`${formatDate(x.followupDate)}<div class="row-sub trunc">${safeText(x.nextAction||'')}</div>`:'\u2014'}</td><td>${listActions('visits',x)}</td></tr>`).join('')||`<tr><td colspan="6">${empt('visits','Sin visitas registradas','A\u00f1ade la primera visita, llamada o reuni\u00f3n.','visits',factoryId)}</td></tr>`}</tbody></table></div></section>`}
function renderBudgets(factoryId='',embedded=false){const list=arr('budgets').filter(x=>(!factoryId||x.factoryId===factoryId)&&matching(x,factoryName(x.factoryId)+' '+modelName(x.modelId))).sort((a,b)=>compareDate(b.date,a.date));const bValid=list.filter(b=>budgetTotal(b)>0);return `${head('Comparador econ\u00f3mico',embedded?'Presupuestos del fabricante':'Todos los presupuestos','Registra varios presupuestos por modelo, cada revisi\u00f3n y las partidas no incluidas.',bigButton('budgets','Nuevo presupuesto',factoryId))}${bValid.length?`<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))"><div class="kpi"><div class="label">Oferta m\u00ednima registrada</div><div class="value">${eur(Math.min(...bValid.map(b=>budgetTotal(b))))}</div><div class="desc">Seg\u00fan importes registrados</div></div><div class="kpi"><div class="label">Oferta m\u00e1xima registrada</div><div class="value">${eur(Math.max(...bValid.map(b=>budgetTotal(b))))}</div><div class="desc">No necesariamente equivalentes</div></div><div class="kpi"><div class="label">Ofertas con importes</div><div class="value">${bValid.length}</div><div class="desc">De ${list.length} presupuestos</div></div></div>`:''}<section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Oferta</th><th>Modelo</th><th>Fecha / estado</th><th>Precio total</th><th>\u20ac/m\u00b2</th><th>Acciones</th></tr></thead><tbody>${list.map(x=>`<tr><td><div class="row-title">${safeText(x.title)}</div><div class="row-sub">${safeText(factoryName(x.factoryId))} ${x.reference?'\u00b7 '+safeText(x.reference):''}</div></td><td>${safeText(modelName(x.modelId))}</td><td>${formatDate(x.date)}<div class="row-sub">${summaryTag(x.status)}</div></td><td><b style="font-size:calc(15px * var(--font-scale))">${eur(budgetTotal(x))}</b><div class="row-sub">${x.vatIncluded?'IVA incluido':'IVA aplicado: '+safeText(x.vatRate||0)+'%'}</div></td><td>${budgetPerM2(x)?eur(budgetPerM2(x)):'\u2014'}</td><td>${listActions('budgets',x)}</td></tr>`).join('')||`<tr><td colspan="6">${empt('budgets','No hay presupuestos','Desglosa los importes y conserva varias ofertas del mismo modelo.','budgets',factoryId)}</td></tr>`}</tbody></table></div></section><p class="fineprint" style="margin-top:11px">El total suma las partidas anotadas, resta el descuento y aplica el IVA si no est\u00e1 incluido. No presupone las partidas que falten. La comparaci\u00f3n por m\u00b2 utiliza la superficie \u00fatil si se conoce, o la construida en su defecto.</p>`}
function renderNotes(factoryId='',embedded=false){const list=arr('notes').filter(x=>(!factoryId||x.factoryId===factoryId)&&matching(x,factoryName(x.factoryId)+' '+modelName(x.modelId))).sort((a,b)=>compareDate(b.date,a.date));return `${head('Cuaderno de anotaciones',embedded?'Observaciones de esta empresa':'Observaciones y hallazgos','A\u00f1ade tantas notas como quieras, sin sobrescribir las anteriores.',bigButton('notes','Nueva observaci\u00f3n',factoryId))}<div style="max-width:980px">${list.map(x=>`<article class="note-card ${x.important?'important':''}"><div class="meta"><div>${summaryTag(x.category||'General')} ${x.important?'<span class="tag amber">Importante</span>':''} <span>${formatDate(x.date)}</span></div><div class="row-actions"><button class="link-btn" data-action="edit" data-kind="notes" data-id="${x.id}">Editar</button><button class="link-btn red" data-action="delete" data-kind="notes" data-id="${x.id}">Borrar</button></div></div><h4>${safeText(x.title)}</h4><div class="body">${safeText(x.body)}</div><div class="meta" style="margin-top:15px"><span>${safeText(factoryName(x.factoryId))} ${x.modelId?'\u00b7 '+safeText(modelName(x.modelId)):''}</span>${x.followupDate?`<span>${ico('agenda',13)} Recordar: ${formatDate(x.followupDate)}</span>`:''}</div>${x.nextAction?`<div class="infobox">Pr\u00f3ximo paso: ${safeText(x.nextAction)}</div>`:''}</article>`).join('')||empt('notes','Sin anotaciones','Registra impresiones, comparaciones, dudas, incidencias y compromisos.','notes',factoryId)}</div>`}
function renderAttachments(factoryId){const f=byId('factories',factoryId);const files=arr('attachments').filter(x=>x.factoryId===factoryId).sort((a,b)=>compareDate(b.createdAt,a.createdAt));return `${head('Archivos adjuntos','Documentos guardados',`PDF, planos, im\u00e1genes y documentos asociados a ${safeText(f.name)}.`, `<button class="btn primary" data-action="upload-factory" data-id="${safeText(factoryId)}">${ico('plus')} Subir archivos</button>`)}<section class="panel"><div class="panel-body">${files.length?files.map(x=>`<div class="attachment-item"><div class="filename">${ico('file',15)} ${safeText(x.fileName)}<small>${bytes(x.size)} \u00b7 ${formatDate(x.createdAt)} \u00b7 ${safeText(x.relatedType)}</small></div><div class="row-actions"><button class="btn small" data-action="download-file" data-id="${x.id}">Descargar</button><button class="link-btn red" data-action="delete-file" data-id="${x.id}">Eliminar</button></div></div>`).join(''):empt('file','No hay documentos','Guarda presupuestos en PDF, planos, fotos y cat\u00e1logos junto a las fichas.')}</div></section><div class="notice warn" style="margin-top:16px">Los documentos se guardan en la base de datos de este navegador, no dentro del archivo HTML. Al exportar una copia JSON se incluyen tambi\u00e9n los adjuntos. Archivos grandes pueden consumir espacio de almacenamiento.</div>`}
function agendaItems(){const items=[];for(const f of arr('factories'))if(f.nextContactDate)items.push({date:f.nextContactDate,kind:'factories',id:f.id,factoryId:f.id,title:'Contactar: '+f.name,sub:'Seguimiento programado desde la ficha'});
 for(const v of arr('visits'))if(v.followupDate)items.push({date:v.followupDate,kind:'visits',id:v.id,factoryId:v.factoryId,title:'Seguimiento tras '+(v.type||'visita'),sub:factoryName(v.factoryId)+' \u00b7 '+(v.nextAction||'Sin detalle')});
 for(const n of arr('notes'))if(n.followupDate)items.push({date:n.followupDate,kind:'notes',id:n.id,factoryId:n.factoryId,title:'Recordatorio: '+n.title,sub:factoryName(n.factoryId)+' \u00b7 '+(n.nextAction||'Revisar observaci\u00f3n')});
 for(const b of arr('budgets'))if(b.validUntil)items.push({date:b.validUntil,kind:'budgets',id:b.id,factoryId:b.factoryId,title:'Vence oferta: '+b.title,sub:factoryName(b.factoryId)});
 return items.sort((a,b)=>compareDate(a.date,b.date))
}
function agendaList(items,compact=false){if(!items.length)return empt('agenda','Nada pendiente','Programa la pr\u00f3xima llamada o una fecha de seguimiento en cualquier visita.');return items.map(x=>{const day=String(x.date||'').split('-');let old=x.date<today();return `<div class="agenda-row ${old?'past':''}"><div class="date-square"><strong>${day[2]||'--'}</strong><span>${['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'][Math.max(0,Number(day[1])-1)]}</span></div><div class="agenda-main"><b>${safeText(x.title)}</b><p>${safeText(x.sub)} ${old?'\u00b7 Vencido':''}</p></div><button class="btn small" data-action="edit" data-kind="${x.kind}" data-id="${x.id}">${compact?'Ver':'Editar'}</button></div>`}).join('')}
function renderAgenda(){const items=agendaItems();return `${head('Calendario del proyecto','Agenda de llamadas y seguimientos','Tareas extra\u00eddas de las fechas de tus fabricantes, visitas, notas y presupuestos.',`<button class="btn" data-action="print">${ico('file')} Imprimir</button>`)}<div class="two-col"><section class="panel"><div class="panel-head"><h3>Hasta hoy / vencidas</h3><span class="tag amber">${items.filter(x=>x.date<=today()).length} registros</span></div><div class="panel-body">${agendaList(items.filter(x=>x.date<=today()))}</div></section><section class="panel"><div class="panel-head"><h3>Pr\u00f3ximas fechas</h3><span class="tag green">${items.filter(x=>x.date>today()).length} registros</span></div><div class="panel-body">${agendaList(items.filter(x=>x.date>today()))}</div></section></div><div class="notice" style="margin-top:17px">Esta agenda funciona cuando abres la aplicaci\u00f3n. No env\u00eda notificaciones si est\u00e1 cerrada. Para no olvidar una fecha, puedes consultar esta pantalla y mantener tus copias de seguridad al d\u00eda.</div>`}
function renderBackup(){return `${head('Protecci\u00f3n de datos','Copias de seguridad y exportaci\u00f3n','Tus datos no dependen de una cuenta ni se env\u00edan a ning\u00fan servidor. Se guardan en el navegador que abre el archivo.')}
 <div class="notice warn" style="margin-bottom:19px"><strong>Muy importante:</strong> los datos que escribas NO se almacenan dentro del propio HTML. Se guardan localmente en este navegador y pueden desaparecer si borras sus datos, usas navegaci\u00f3n privada o cambias de ordenador. Descarga copias JSON con frecuencia y cons\u00e9rvalas fuera del navegador.</div>
 <div class="backup-layout">
 <div class="feature-box"><div class="feature-icon">${ico('backup',22)}</div><h3>Guardar una copia completa</h3><p>Exporta empresas, modelos, presupuestos, visitas, observaciones y archivos adjuntos a un \u00fanico fichero <b>.json</b>. Esta es la copia que permite restaurar todo el trabajo.</p><button class="btn primary" data-action="backup-json">${ico('backup',15)} Descargar copia JSON</button><p class="fineprint">Si has adjuntado PDF o fotograf\u00edas, el fichero JSON puede ser grande.</p></div>
 <div class="feature-box"><div class="feature-icon">${ico('file',22)}</div><h3>Restaurar o importar una copia</h3><p>Selecciona un JSON exportado con CasaRadar. Puedes sustituir los datos actuales o combinar los registros de esa copia con los que ya tienes.</p><label class="btn" style="cursor:pointer">${ico('file',15)} Seleccionar JSON<input id="import-file" type="file" accept=".json,application/json" style="display:none"></label><p class="fineprint">Antes de sustituir los datos, guarda un respaldo de seguridad.</p></div>
 <div class="feature-box"><div class="feature-icon">${ico('chart',22)}</div><h3>Exportar tablas CSV</h3><p>Descarga los datos de cada secci\u00f3n para abrirlos en Excel o compartirlos por correo. No incluyen los archivos adjuntos.</p><div class="csv-btns">${[['factories','Fabricantes'],['models','Modelos'],['visits','Visitas'],['budgets','Presupuestos'],['notes','Notas']].map(([k,title])=>`<button class="btn small" data-action="csv" data-kind="${k}">${title} CSV</button>`).join('')}</div></div>
 <div class="feature-box"><div class="feature-icon">${ico('alert',22)}</div><h3>Informaci\u00f3n sobre tu almacenamiento</h3><p><b>Sistema:</b> ${store.mode==='indexeddb'?'IndexedDB del navegador':store.mode==='localstorage'?'LocalStorage del navegador':'Memoria temporal (no persistente)'}.</p><p><b>Registros:</b> ${STORE_NAMES.map(n=>arr(n).length).reduce((a,b)=>a+b,0)}; <b>archivos:</b> ${arr('attachments').length}.</p><p>Abre siempre este mismo archivo con el mismo navegador y perfil. Cambiar el nombre o la ubicaci\u00f3n del HTML puede impedir que aparezcan los datos antiguos en algunos navegadores.</p><button class="btn small danger" data-action="reset">Borrar toda mi base de datos</button></div>
 </div>
 <section class="panel" style="margin-top:20px"><div class="panel-head"><h3>C\u00f3mo utilizar la aplicaci\u00f3n</h3></div><div class="panel-body">${[

 ].map(([title,p])=>`<div class="help-row"><div class="kpi-icon" style="flex:none">${ico('check',16)}</div><div><b>${title}</b><span class="muted" style="line-height:1.6">${p}</span></div></div>`).join('')}</div></section>`}
const PAGE_RENDER={dashboard:renderDashboard,factories:renderFactories,models:()=>renderModels(),visits:()=>renderVisits(),budgets:()=>renderBudgets(),notes:()=>renderNotes(),agenda:renderAgenda,backup:renderBackup,accessibility:renderAccessibility,factory:renderFactoryDetail};
const RECORD_NOUN={factories:'fabricante',models:'modelo de casa',visits:'visita o llamada',budgets:'presupuesto',notes:'observaci\u00f3n'};
function defaultRecord(kind,ctx={}){const d={id:id(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};if(kind==='factories')Object.assign(d,{status:'Sin contactar',priority:'Media',verified:'Pendiente de confirmar',manufacturerType:'Por confirmar',buildsAlicante:'Por confirmar',ctebuilt:'Por confirmar'});if(kind==='models')Object.assign(d,{status:'En estudio',cte:'Por confirmar',floors:1});if(kind==='visits')Object.assign(d,{date:isoDateTime(),status:'Pendiente',type:'Llamada'});if(kind==='budgets')Object.assign(d,{date:today(),status:'Solicitado',vatRate:0,vatIncluded:false});if(kind==='notes')Object.assign(d,{date:today(),category:'General'});if(ctx.factoryId)d.factoryId=ctx.factoryId;if(ctx.modelId)d.modelId=ctx.modelId;return d}
function selectFieldOptions(field,rec){let choices=[];
 if(field.type==='factory')choices=arr('factories').slice().sort((a,b)=>a.name.localeCompare(b.name,'es')).map(x=>({value:x.id,label:x.name+' ('+(x.city||x.province||'')+')'}));
 if(field.type==='model')choices=arr('models').filter(x=>!rec.factoryId||x.factoryId===rec.factoryId||x.id===rec.modelId).sort((a,b)=>a.name.localeCompare(b.name,'es')).map(x=>({value:x.id,label:x.name+' \u00b7 '+factoryName(x.factoryId)}));
 if(field.type==='visit')choices=arr('visits').filter(x=>!rec.factoryId||x.factoryId===rec.factoryId||x.id===rec.visitId).map(x=>({value:x.id,label:(x.type||'Visita')+' \u00b7 '+formatDatetime(x.date)+' \u00b7 '+factoryName(x.factoryId)}));
 if(field.type==='budget')choices=arr('budgets').filter(x=>!rec.factoryId||x.factoryId===rec.factoryId||x.id===rec.budgetId).map(x=>({value:x.id,label:x.title+' \u00b7 '+formatDate(x.date)}));
 if(field.type==='select')choices=(field.options||[]).map(x=>({value:x,label:x}));
 return choices;
}
function renderField(field,rec){const v=rec[field.key]??'',name=safeText(field.key),tag=safeText(field.label),inputId='form-'+name;const req=field.required?'required':'';const pattern=field.required?'<span class="required"> *</span>':'';const help=field.help?`<small class="help">${safeText(field.help)}</small>`:'';
 if(field.type==='checkbox')return `<div class="field ${field.wide?'full':''}"><div class="check-field"><input type="checkbox" name="${name}" id="${inputId}" ${v?'checked':''}><label for="${inputId}">${tag}${pattern}</label></div>${help}</div>`;
 if(['select','factory','model','visit','budget'].includes(field.type)){const options=selectFieldOptions(field,rec);return `<div class="field ${field.wide?'full':''}"><label for="${inputId}">${tag}${pattern}</label><select name="${name}" id="${inputId}" ${req}><option value="">${field.required?'Seleccionar...':'Sin indicar / opcional'}</option>${options.map(o=>`<option value="${safeText(o.value)}" ${String(o.value)===String(v)?'selected':''}>${safeText(o.label)}</option>`).join('')}</select>${help}</div>`}
 if(field.type==='textarea')return `<div class="field ${field.wide?'full':''}"><label for="${inputId}">${tag}${pattern}</label><textarea name="${name}" id="${inputId}" rows="${field.wide?4:3}" ${req}>${safeText(v)}</textarea>${help}</div>`;
 const attr=field.type==='number'?`step="any" min="0" ${field.max?'max="'+field.max+'"':''}`:'';return `<div class="field ${field.wide?'full':''}"><label for="${inputId}">${tag}${pattern}</label><input type="${field.type}" id="${inputId}" name="${name}" value="${safeText(v)}" ${attr} ${req} autocomplete="off">${help}</div>`
}
function renderFormSections(kind,rec){const groups={};for(const f of FIELDS[kind]){(groups[f.group]||(groups[f.group]=[])).push(f)}return Object.entries(groups).map(([name,fields],idx)=>`<details class="form-section" ${SECTION_OPEN[name]||idx===0?'open':''}><summary>${safeText(name)} <span style="font-weight:500;font-size:calc(11px * var(--font-scale));color:#7c9695">${fields.length} campos</span></summary><div class="inputs">${fields.map(f=>renderField(f,rec)).join('')}</div></details>`).join('')}
function modalWrap(title,sub,inner,foot='',size=''){return `<div class="modal-backdrop" id="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" ${size?`style="max-width:${size}"`:''}><div class="modal-head"><div><h2 id="modal-title">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="close-btn" data-action="close-modal" aria-label="Cerrar">&times;</button></div><div class="modal-scroller">${inner}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`}
function existingFileMarkup(kind,rec){const list=attachedTo(kind,rec.id);return list.length?`<div style="margin-bottom:13px">${list.map(a=>`<div class="attachment-item"><div class="filename">${ico('file',14)} ${safeText(a.fileName)}<small>${bytes(a.size)}</small></div><div class="row-actions"><button class="link-btn" type="button" data-action="download-file" data-id="${a.id}">Descargar</button><button class="link-btn red" type="button" data-action="delete-file" data-id="${a.id}">Eliminar</button></div></div>`).join('')}</div>`:''}
function budgetPricePreview(rec){const total=budgetTotal(rec);return `<div class="price-preview"><div><b>COSTE TOTAL CALCULADO</b><br><small id="price-preview-caption">${rec.vatIncluded?'IVA incluido en importes':`IVA adicional: ${Number(rec.vatRate)||0}%`} \u00b7 No incluye partidas sin anotar</small></div><div style="text-align:right"><strong id="price-preview-total">${eur(total)}</strong><div id="price-preview-m2" class="tiny muted">${budgetPerM2(rec)?eur(budgetPerM2(rec))+'/m\u00b2':'Sin superficie'}</div></div></div>`}
function showForm(kind,recordId='',ctx={}){if(!FIELDS[kind])return;
 const old=recordId?byId(kind,recordId):null;if(recordId&&!old){alertToast('Registro no encontrado',true);return}const rec=old?{...old}:ctx.prefill?{...defaultRecord(kind,ctx),...ctx.prefill}:defaultRecord(kind,ctx);state.modal={type:'form',kind,recordId,rec,dirty:false};
 let sections=renderFormSections(kind,rec);
 const filesBlock=`<details class="form-section" ${recordId?'open':''}><summary>Documentos y archivos adjuntos</summary><div style="padding:16px">${recordId?existingFileMarkup(kind,rec):''}<div class="file-zone"><b>Adjuntar documentos nuevos (opcional)</b><p class="tiny muted">PDF, fotos, cat\u00e1logos, planos, hojas de c\u00e1lculo. M\u00e1ximo 20 MB por archivo.</p><input type="file" name="files" id="form-files" multiple ${store.mode!=='indexeddb'?'disabled':''} accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx,.txt,.odt,.zip,application/pdf,image/*"></div>${store.mode!=='indexeddb'?'<p class="tiny muted">Adjuntos disponibles solo con guardado IndexedDB.</p>':''}</div></details>`;
 const title=(recordId?'Editar ':'Nuevo ')+RECORD_NOUN[kind];const sub=recordId?'Modifica la ficha sin borrar sus registros relacionados.':'Completa lo que sepas ahora; puedes volver y ampliar todos los campos.';
 $('#modal-root').innerHTML=modalWrap(title,sub,`<form id="record-form" data-kind="${kind}" data-id="${safeText(recordId)}">${kind==='budgets'?budgetPricePreview(rec):''}${sections}${filesBlock}<button type="submit" id="hidden-submit" style="display:none"></button></form>`,`<div class="left">${recordId?`<button class="btn small danger" data-action="delete" data-kind="${kind}" data-id="${rec.id}">Eliminar ficha</button>`:'<span class="tiny muted">* Campos obligatorios</span>'}</div><div class="right"><button class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" data-action="submit-form">${ico('check',16)} Guardar</button></div>`);
 document.body.style.overflow='hidden';setTimeout(()=>{const first=$('#record-form [name="name"]')||$('#record-form [name="title"]')||$('#record-form input:not([type=file])');if(first)first.focus({preventScroll:true});if(kind==='budgets')updateBudgetPreview()},50)
}
function closeModal(force=false){if(!force&&state.modal?.dirty&&!confirm('Hay cambios sin guardar en esta ficha. ¿Salir sin guardarlos?'))return;state.modal=null;$('#modal-root').innerHTML='';document.body.style.overflow=''}
function getFormData(kind){const f=$('#record-form');if(!f)return null;const data={};for(const field of FIELDS[kind]){const el=f.elements.namedItem(field.key);if(!el)continue;if(field.type==='checkbox')data[field.key]=el.checked;else if(field.type==='number')data[field.key]=el.value.trim()===''?null:Number(el.value);else data[field.key]=String(el.value||'').trim()}return data}
function updateBudgetPreview(){if(state.modal?.kind!=='budgets')return;const values=getFormData('budgets');if(!values)return;const merged={...state.modal.rec,...values};$('#price-preview-total').textContent=eur(budgetTotal(merged));$('#price-preview-caption').textContent=(merged.vatIncluded?'IVA incluido en importes':'IVA adicional: '+(Number(merged.vatRate)||0)+'%')+' \u00b7 No incluye partidas sin anotar';$('#price-preview-m2').textContent=budgetPerM2(merged)?eur(budgetPerM2(merged))+'/m\u00b2':'Sin superficie'}
async function saveForm(event){event.preventDefault();const f=event.target;const kind=f.dataset.kind;const data=getFormData(kind);if(!f.reportValidity())return;try{
 const rec=state.modal.rec;const oldFactory=rec.factoryId;Object.assign(rec,data);rec.updatedAt=new Date().toISOString();
 if(rec.modelId&&byId('models',rec.modelId)?.factoryId!==rec.factoryId){rec.modelId=''}
 if(rec.visitId&&byId('visits',rec.visitId)?.factoryId!==rec.factoryId)rec.visitId='';
 if(rec.budgetId&&byId('budgets',rec.budgetId)?.factoryId!==rec.factoryId)rec.budgetId='';
 await store.put(kind,rec);
 if(kind==='models'&&oldFactory&&oldFactory!==rec.factoryId){for(const sub of ['visits','budgets','notes'])for(const x of arr(sub).filter(x=>x.modelId===rec.id)){x.factoryId=rec.factoryId;await store.put(sub,x)}}
 if(kind!=='factories'&&oldFactory&&oldFactory!==rec.factoryId){for(const a of attachedTo(kind,rec.id)){a.factoryId=rec.factoryId;await store.put('attachments',a)}}
 const files=$('#form-files')?.files;if(files?.length)await uploadFiles(files,kind,rec.id,kind==='factories'?rec.id:rec.factoryId);
 await sync();closeModal(true);
 if(kind==='factories'&&!f.dataset.id){state.selectedFactoryId=rec.id;state.factoryTab='overview';state.page='factory'}
 if(state.page==='factory'){if(kind==='models')state.factoryTab='models';else if(kind==='visits')state.factoryTab='visits';else if(kind==='budgets')state.factoryTab='budgets';else if(kind==='notes')state.factoryTab='notes'}
 render();alertToast((f.dataset.id?'Cambios guardados':'Registro creado')+' en este navegador');
 }catch(e){console.error(e);alertToast('No se pudo guardar: '+e.message,true)}
}
async function uploadFiles(files,kind,relatedId,factoryId){if(store.mode!=='indexeddb'){alertToast('No se pueden guardar adjuntos en este navegador.',true);return}for(const file of Array.from(files)){if(file.size>20*1024*1024){alertToast('Archivo mayor de 20 MB omitido: '+file.name,true);continue}const blob=file.slice(0,file.size,file.type);await store.put('attachments',{id:id(),relatedType:kind,relatedId,factoryId:factoryId||'',fileName:file.name,mimeType:file.type||'application/octet-stream',size:file.size,blob,createdAt:new Date().toISOString()})}}
async function uploadToFactory(fid){const input=document.createElement('input');input.type='file';input.multiple=true;input.accept='.pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx,.txt,.zip,image/*';input.addEventListener('change',async()=>{try{await uploadFiles(input.files,'factories',fid,fid);await sync();render();alertToast('Archivos guardados en el fabricante')}catch(e){alertToast(e.message,true)}},{once:true});input.click()}
async function deleteRecord(kind,recordId){const x=byId(kind,recordId);if(!x)return;let extra='';if(kind==='factories'){const numbers=['models','visits','budgets','notes','attachments'].map(k=>arr(k).filter(x=>x.factoryId===recordId).length);extra=`\nTambi\u00e9n se eliminar\u00e1n ${numbers[0]} modelos, ${numbers[1]} visitas, ${numbers[2]} presupuestos, ${numbers[3]} notas y ${numbers[4]} archivos asociados.`}
 if(!confirm(`\u00bfEliminar definitivamente ${RECORD_NOUN[kind]} "${x.name||x.title||x.type||''}"?${extra}\nNo se puede deshacer. Haz una copia JSON antes si necesitas conservarlo.`))return;
 try{if(kind==='factories'){for(const k of STORE_NAMES.filter(k=>k!=='factories'))for(const r of arr(k).filter(r=>r.factoryId===recordId))await store.del(k,r.id)}else{
  for(const r of attachedTo(kind,recordId))await store.del('attachments',r.id);
  if(kind==='models')for(const k of ['visits','budgets','notes'])for(const r of arr(k).filter(r=>r.modelId===recordId)){r.modelId='';await store.put(k,r)}
  if(kind==='visits')for(const r of arr('notes').filter(r=>r.visitId===recordId)){r.visitId='';await store.put('notes',r)}
  if(kind==='budgets')for(const r of arr('notes').filter(r=>r.budgetId===recordId)){r.budgetId='';await store.put('notes',r)}
 }
 await store.del(kind,recordId);await sync();if(state.page==='factory'&&state.selectedFactoryId===recordId){state.page='factories';state.selectedFactoryId=null}closeModal(true);render();alertToast('Registro eliminado');
 }catch(e){alertToast(e.message,true)}
}
async function deleteFile(fileId){const x=byId('attachments',fileId);if(!x)return;if(!confirm(`\u00bfEliminar adjunto ${x.fileName}?`))return;await store.del('attachments',fileId);await sync();if(state.modal?.type==='form')showForm(state.modal.kind,state.modal.recordId);else render();alertToast('Archivo eliminado')}
function downloadBlob(b,name){
 if(window.CasaRadarNative && typeof window.CasaRadarNative.saveFile==='function'){
  const reader=new FileReader();
  reader.onload=()=>{try{
   const raw=String(reader.result||'');
   window.CasaRadarNative.saveFile(name,b.type||'application/octet-stream',raw.substring(raw.indexOf(',')+1));
  }catch(e){alertToast('No se pudo solicitar el guardado: '+e.message,true)}};
  reader.onerror=()=>alertToast('No se pudo leer el archivo para exportarlo.',true);
  reader.readAsDataURL(b);
  return;
 }
 const u=URL.createObjectURL(b);
 const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),60000)
}
async function downloadFile(fileId){const x=byId('attachments',fileId);if(!x)return;downloadBlob(x.blob,x.fileName)}
function quickMenu(){const actions=[['factories','Fabricante nuevo','A\u00f1adir otra empresa al directorio'],['models','Modelo de casa','Ficha de una vivienda concreta'],['visits','Visita o llamada','Registrar fecha y lo que ocurri\u00f3'],['budgets','Presupuesto','Oferta con desglose de costes'],['notes','Observaci\u00f3n','Guardar una nota o recordatorio']];const fid=state.page==='factory'?state.selectedFactoryId:'';$('#modal-root').innerHTML=modalWrap('Registrar actividad','Elige qu\u00e9 deseas guardar.',`<div style="display:grid;gap:9px">${actions.map(([k,title,sub])=>`<button class="btn" style="display:flex;justify-content:flex-start;text-align:left;white-space:normal;padding:14px;gap:14px" data-action="new" data-kind="${k}" ${fid?`data-factory="${fid}"`:''}><div class="kpi-icon">${ico(k,21)}</div><div><b style="display:block">${title}</b><span class="muted tiny">${sub}</span></div></button>`).join('')}</div>`);state.modal={type:'quick'};document.body.style.overflow='hidden'}
async function blobBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
function fromBase64(encoded,mime){const bin=atob(encoded);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type:mime||'application/octet-stream'})}
async function backupJSON(){try{
 const b={app:'CasaRadar',schemaVersion:1,exportedAt:new Date().toISOString(),origin:'Casa Radar Android o web; copia local',data:{}};
 for(const kind of STORE_NAMES){if(kind==='attachments'){b.data[kind]=[];for(const row of arr(kind))b.data[kind].push({...Object.fromEntries(Object.entries(row).filter(([k])=>k!=='blob')),base64:await blobBase64(row.blob)})}else b.data[kind]=arr(kind).map(x=>({...x}))}
 const filename='CasaRadar_COPIA_'+today()+'.json';downloadBlob(new Blob([JSON.stringify(b,null,2)],{type:'application/json;charset=utf-8'}),filename);alertToast('Copia JSON descargada. Gu\u00e1rdala en una carpeta segura.');
 }catch(e){console.error(e);alertToast('Error al preparar la copia: '+e.message,true)}
}
function saveCSV(kind){const cols=(FIELDS[kind]||[]).map(f=>f.key);const headers=(FIELDS[kind]||[]).map(f=>f.label);let extra=kind==='budgets'?['total','precio_m2']:[];const csv=[['id',...headers,...extra].join(';'),...arr(kind).map(row=>[row.id,...cols.map(k=>row[k]??''),...extra.map(k=>k==='total'?budgetTotal(row):budgetPerM2(row))].map(cell=>'"'+String(cell==null?'':cell).replace(/"/g,'""')+'"').join(';'))].join('\r\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'CasaRadar_'+kind+'_'+today()+'.csv');alertToast('CSV descargado')}
async function prepareImport(file){try{if(!file)return;const contents=await file.text();if(contents.length>120000000)throw Error('Archivo demasiado grande');const backup=JSON.parse(contents);if(backup.app!=='CasaRadar'||!backup.data||!Array.isArray(backup.data.factories))throw Error('No es una copia de CasaRadar compatible');
 const summary=STORE_NAMES.map(k=>`${(backup.data[k]||[]).length} ${k}`).join(' \u00b7 ');state.modal={type:'import',backup};$('#modal-root').innerHTML=modalWrap('Importar copia de seguridad','Se ha le\u00eddo el archivo, pero todav\u00eda no se ha importado nada.',`<div class="notice"><b>${safeText(file.name)}</b><br>Fecha de respaldo: ${formatDatetime(backup.exportedAt)}<br>${summary}</div><p style="line-height:1.7">Elige si deseas <b>sustituir todos los datos</b> de este navegador por los del respaldo o <b>combinar</b> la copia con los registros existentes (los identificadores coincidentes se actualizar\u00e1n).</p><div class="notice warn">Si tienes informaci\u00f3n importante actualmente en esta app, descarga antes una copia JSON propia.</div>`,`<div class="left"><button class="btn" data-action="close-modal">Cancelar</button></div><div class="right"><button class="btn" data-action="apply-import" data-mode="merge">Combinar registros</button><button class="btn danger" data-action="apply-import" data-mode="replace">Sustituir todo</button></div>`);
 document.body.style.overflow='hidden';
 }catch(e){alertToast('No se puede leer esa copia: '+e.message,true)}
}
async function applyImport(mode){const backup=state.modal?.backup;if(!backup)return;
 if(mode==='replace'&&!confirm('Se sustituir\u00e1n TODOS los registros del navegador por los de la copia. \u00bfConfirmar?'))return;
 const clean={};try{
 for(const n of STORE_NAMES){clean[n]=[];for(const item of backup.data[n]||[]){if(typeof item!=='object'||item===null||typeof item.id!=='string')continue;const rec={...item};if(n==='attachments'){if(store.mode!=='indexeddb')continue;if(!rec.base64)continue;rec.blob=fromBase64(rec.base64,rec.mimeType);delete rec.base64}clean[n].push(rec)}}
 if(mode==='replace')await store.replaceAll(clean);
 else for(const n of STORE_NAMES)for(const rec of clean[n])await store.put(n,rec);
 await sync();closeModal(true);state.page='dashboard';state.selectedFactoryId=null;render();alertToast('Copia importada correctamente');
 }catch(e){console.error(e);alertToast('Error al importar: '+e.message,true)}
}
async function resetAll(){if(!confirm('Esto eliminar\u00e1 todos tus fabricantes, modelos, visitas, presupuestos, notas y adjuntos de este navegador. \u00bfContinuar?'))return;const x=prompt('Escribe BORRAR para confirmar. Esta operaci\u00f3n no se puede deshacer.');if(x!=='BORRAR')return;try{await store.replaceAll(Object.fromEntries(STORE_NAMES.map(n=>[n,[]])));await sync();setPage('dashboard');alertToast('Base de datos vaciada')}catch(e){alertToast(e.message,true)}}
function updateRelatedDropdowns(){const rec=getFormData(state.modal.kind)||{};const kind=state.modal.kind;for(const [key,typ] of [['modelId','model'],['visitId','visit'],['budgetId','budget']]){
 const select=$(`#record-form [name="${key}"]`);if(!select)continue;const field=FIELDS[kind].find(x=>x.key===key);const curr=select.value;const choices=selectFieldOptions(field,rec);select.innerHTML=`<option value="">Sin indicar / opcional</option>`+choices.map(o=>`<option value="${safeText(o.value)}" ${o.value===curr?'selected':''}>${safeText(o.label)}</option>`).join('')}
}
document.addEventListener('submit',e=>{if(e.target.id==='record-form')saveForm(e)});
document.addEventListener('click',async e=>{
 const pag=e.target.closest('[data-page]');if(pag){setPage(pag.dataset.page);return}
 const a=e.target.closest('[data-action]');if(!a){if(e.target.id==='modal-backdrop')closeModal();return}
 const action=a.dataset.action,kind=a.dataset.kind,rowId=a.dataset.id;
 try{
  if(action==='quick-add'){if(['models','visits','budgets','notes'].includes(state.page))showForm(state.page);else quickMenu()}
  else if(action==='new')showForm(kind,'',{factoryId:a.dataset.factory||'',modelId:a.dataset.model||''});
  else if(action==='edit')showForm(kind,rowId);
  else if(action==='duplicate'){const orig=byId(kind,rowId);if(orig){const copy={...orig,id:id(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};if(kind==='models'){copy.name=(copy.name||'')+' (copia)';copy.status='En estudio'}else if(kind==='budgets'){copy.title=(copy.title||'')+' (nueva oferta)';copy.reference='';copy.date=today();copy.status='Solicitado'}showForm(kind,'',{factoryId:copy.factoryId,modelId:copy.modelId,prefill:copy})}}
  else if(action==='close-modal')closeModal();
  else if(action==='submit-form')$('#record-form')?.requestSubmit();
  else if(action==='delete')await deleteRecord(kind,rowId);
  else if(action==='open-factory'){state.factoryTab='overview';setPage('factory',rowId)}
  else if(action==='factory-tab'){state.factoryTab=a.dataset.tab;render()}
  else if(action==='star'){const f=byId('factories',rowId);f.favorite=!f.favorite;await store.put('factories',f);await sync();render()}
  else if(action==='upload-factory')await uploadToFactory(rowId);
  else if(action==='download-file')await downloadFile(rowId);
  else if(action==='delete-file')await deleteFile(rowId);
  else if(action==='backup-json')await backupJSON();
  else if(action==='csv')saveCSV(kind);
  else if(action==='apply-import')await applyImport(a.dataset.mode);
  else if(action==='reset')await resetAll();
  else if(action==='access-step')setAccessPrefs({fontPercent:accessPrefs.fontPercent+Number(a.dataset.step)});
  else if(action==='access-preset')setAccessPrefs({fontPercent:Number(a.dataset.size)});
  else if(action==='access-reset')setAccessPrefs({...ACCESS_DEFAULTS});
  else if(action==='access-toggle'){const option=a.dataset.accessToggle;if(['highContrast','largeControls'].includes(option))setAccessPrefs({[option]:!accessPrefs[option]})}
  else if(action==='print')window.print();
 }catch(ex){console.error(ex);alertToast('Error: '+ex.message,true)}
});
document.addEventListener('input',e=>{
 if(e.target.id==='access-font-range')setAccessPrefs({fontPercent:Number(e.target.value)});
 if(e.target.id==='global-search'){state.query=e.target.value;if(['dashboard','backup','agenda','accessibility'].includes(state.page)){state.page='factories'}render()}
 if(e.target.closest('#record-form')&&state.modal?.type==='form'){state.modal.dirty=true;if(state.modal.kind==='budgets')updateBudgetPreview();}
});
document.addEventListener('change',e=>{
 if(e.target.id==='filter-province'){state.filters.province=e.target.value;render()}
 if(e.target.id==='filter-status'){state.filters.status=e.target.value;render()}
 if(e.target.id==='filter-priority'){state.filters.priority=e.target.value;render()}
 if(e.target.id==='import-file'){const file=e.target.files?.[0];prepareImport(file)}
 if(e.target.name==='factoryId'&&e.target.closest('#record-form')){state.modal.dirty=true;updateRelatedDropdowns();}
});
window.addEventListener('beforeunload',e=>{if(state.modal?.dirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal();if((e.ctrlKey||e.metaKey)&&e.key==='s'&&state.modal?.type==='form'){e.preventDefault();$('#record-form')?.requestSubmit()}});
$('#mobile-toggle').addEventListener('click',()=>{$('#sidebar').classList.toggle('open');$('#mobile-backdrop').classList.toggle('show')});$('#mobile-backdrop').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#mobile-backdrop').classList.remove('show')});
applyAccessPrefs();
boot();
</script>
